<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UOMI | Shop</title>
    <meta name="description" content="Shop handcrafted ceramic art pieces from UOMI." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="shop-page">
    <script src="figures.js"></script>
    <div class="page-bg page-bg-pattern is-shop" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMinYMin" width="100%" height="100%">
        <rect width="100%" height="100%" fill="url(#uomi-pattern)" />
      </svg>
    </div>

    <header class="topbar">
      <div class="container nav">
        <a href="index.html" class="brand" aria-label="UOMI"><img src="images/uomi-logo.png" alt="UOMI" width="77" height="30" /></a>
        <nav>
          <a href="index.html"   data-i18n="nav.home">Home</a>
          <a href="shop.html"    data-i18n="nav.shop">Shop</a>
          <a href="about.html"   data-i18n="nav.about">About</a>
          <a href="contact.html" data-i18n="nav.contact">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="container section" id="shop">
        <div class="section-title-row">
          <h2 data-i18n="shop.title">Collection</h2>
        </div>
        <!-- Products are rendered here by script.js from products.js -->
        <div id="productGrid"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <button type="button" class="nl-open-btn" data-nl-open data-i18n="nl.open">Subscribe to our newsletter</button>
        <p data-i18n-html="shop.footer">&copy; <span id="year"></span> UOMI. All rights reserved. &middot; Payments by Stripe.</p>
      </div>
    </footer>

    <script src="products.js"></script>
    <script src="i18n.js"></script>
    <script src="script.js"></script>
  </body>
</html>
