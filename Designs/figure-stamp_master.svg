<!-- HEAD — oval 12w × 22h (was 10×20, enlarged by ⅕ cuadrito = 2 svg in each dim). Center (50, 2) → spans y=-9 to y=13. Head→body gap remains 6 svg. --> <ellipse cx="50" cy="2" rx="6" ry="11" stroke="none" data-om-id="5af614a9:24"></ellipse> <!-- BODY — elongated egg with NARROWED upper half (1.25 svg per side pulled in via control points). Widest point unchanged at x=±15, y=67. --> <path stroke="none" d=" M 50 19 C 37.75 19, 36.25 47, 35 67 C 35 80, 41 87, 50 87 C 59 87, 65 80, 65 67 C 63.75 47, 62.25 19, 50 19 Z" data-om-id="5af614a9:25"></path> <!-- LEFT ARM — angle reduced by 5° (14.9° → 9.9° from vertical). Length ≈ 39.84 svg unchanged. From (32.25, 28.5) to (25.5, 67.75) --> <line x1="32.25" y1="28.5" x2="25.5" y2="67.75" fill="none" stroke-width="3.75" data-om-id="5af614a9:26"></line> <!-- RIGHT ARM — mirror --> <line x1="67.75" y1="28.5" x2="74.5" y2="67.75" fill="none" stroke-width="3.75" data-om-id="5af614a9:27"></line> <!-- LEFT LEG — from (43.125,93) to (43.125,138) length = 45 svg = 4.5u ✓ (was 4.0u; +13.3% with body elongation) each leg moved 0.625 svg inward (⅛ cuadrito closer); centered on x=50 --> <line x1="43.125" y1="93" x2="43.125" y2="138" fill="none" stroke-width="3.75" data-om-id="5af614a9:28"></line> <!-- RIGHT LEG --> <line x1="56.875" y1="93" x2="56.875" y2="138" fill="none" stroke-width="3.75" data-om-id="5af614a9:29"></line>
